<text x="443" y="613" font-size="19" font-weight="400">策略被拒不必连带丢弃有效记忆</text>
</g>
<g class="node"><rect x="1045" y="520" width="348" height="105" rx="12" fill="#f2ecf6" stroke="#805b96" stroke-width="1.5"/>
