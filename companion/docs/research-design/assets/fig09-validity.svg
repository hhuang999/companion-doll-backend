<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#243538} .edge{fill:none;stroke:#718087;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1440" height="860" fill="#fbfaf6"/>
<text x="48" y="52" font-size="30" font-weight="700">09  新输入到来：按产物判断，不一律丢弃</text>
<text x="48" y="88" font-size="19" font-weight="400">不同产物的使用时机与证据不同；最终状态通过事务中的比较交换（CAS）保护。</text>
<g class="node"><rect x="48" y="130" width="1345" height="90" rx="12" fill="#f0f2f2" stroke="#59666b" stroke-width="1.5"/>
<text x="66" y="163" font-size="23" font-weight="700">新输入／纠正／取消</text>
<text x="66" y="195" font-size="19" font-weight="400">按事件更新输入游标／输出代次；下面四个分支分别判断有效性。</text>
</g>
<g class="node"><rect x="48" y="260" width="320" height="105" rx="12" fill="#f9ebea" stroke="#a24a4b" stroke-width="1.5"/>
<text x="66" y="293" font-size="23" font-weight="700">当轮输出／播放</text>
</g>
<g class="node"><rect x="425" y="260" width="565" height="105" rx="12" fill="#f9ebea" stroke="#a24a4b" stroke-width="1.5"/>
<text x="443" y="293" font-size="23" font-weight="700">独立检查</text>
<text x="443" y="325" font-size="19" font-weight="400">旧generation立即失效</text>
<text x="443" y="353" font-size="19" font-weight="400">未发送文本与预取音频停止</text>
</g>
<g class="node"><rect x="1045" y="260" width="348" height="105" rx="12" fill="#f9ebea" stroke="#a24a4b" stroke-width="1.5"/>
<text x="1063" y="293" font-size="23" font-weight="700">采用结果</text>
<text x="1063" y="325" font-size="19" font-weight="400">当前代次重新组织表达</text>
</g>
