<polyline class="edge" points="990,313 1045,313"/>
<g class="node"><rect x="48" y="390" width="320" height="105" rx="12" fill="#edf0fa" stroke="#465aa0" stroke-width="1.5"/>
<text x="66" y="423" font-size="23" font-weight="700">SupportPlan策略</text>
</g>
