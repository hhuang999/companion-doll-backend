<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 870" role="img" aria-labelledby="title desc">
<title id="title">04  内容层次：原则、策略与脚本分别承担什么</title><desc id="desc">策略是有条件的可选内容；倾听、安静与拒绝本身是成立的互动结果。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718087"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#243538} .edge{fill:none;stroke:#718087;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1440" height="870" fill="#fbfaf6"/>
<text x="48" y="52" font-size="30" font-weight="700">04  内容层次：原则、策略与脚本分别承担什么</text>
<text x="48" y="88" font-size="19" font-weight="400">策略是有条件的可选内容；倾听、安静与拒绝本身是成立的互动结果。</text>
<g class="node"><rect x="48" y="130" width="1337" height="92" rx="12" fill="#f0f2f2" stroke="#59666b" stroke-width="1.5"/>
<text x="66" y="163" font-size="23" font-weight="700">贯穿所有互动的原则</text>
<text x="66" y="195" font-size="19" font-weight="400">低评判、尊重意愿、准确表达、一次一个焦点；不把未知补成事实</text>
</g>
<g class="node"><rect x="48" y="270" width="420" height="125" rx="12" fill="#e8f3ef" stroke="#24746c" stroke-width="1.5"/>
<text x="66" y="303" font-size="23" font-weight="700">S16  具体一步</text>
<text x="66" y="335" font-size="19" font-weight="400">反复想 → 具体片段</text>
<text x="66" y="363" font-size="19" font-weight="400">可控的小步骤</text>
</g>
<g class="node"><rect x="499" y="270" width="420" height="125" rx="12" fill="#e8f3ef" stroke="#24746c" stroke-width="1.5"/>
<text x="517" y="303" font-size="23" font-weight="700">kind_self_talk</text>
<text x="517" y="335" font-size="19" font-weight="400">苛责 → 准确温和表达</text>
<text x="517" y="363" font-size="19" font-weight="400">不做积极保证</text>
</g>
<g class="node"><rect x="950" y="270" width="420" height="125" rx="12" fill="#e8f3ef" stroke="#24746c" stroke-width="1.5"/>
<text x="968" y="303" font-size="23" font-weight="700">safe_communication</text>
<text x="968" y="335" font-size="19" font-weight="400">已有安全对象</text>
<text x="968" y="363" font-size="19" font-weight="400">只练一句表达</text>
</g>
<g class="node"><rect x="48" y="425" width="420" height="125" rx="12" fill="#e8f3ef" stroke="#24746c" stroke-width="1.5"/>
<text x="66" y="458" font-size="23" font-weight="700">safe_support</text>
<text x="66" y="490" font-size="19" font-weight="400">探索现实支持入口</text>
<text x="66" y="518" font-size="19" font-weight="400">对象、渠道与透露范围</text>
</g>
<g class="node"><rect x="499" y="425" width="420" height="125" rx="12" fill="#e8f3ef" stroke="#24746c" stroke-width="1.5"/>
<text x="517" y="458" font-size="23" font-weight="700">values_exploration</text>
<text x="517" y="490" font-size="19" font-weight="400">不确定方向</text>
<text x="517" y="518" font-size="19" font-weight="400">小规模了解可靠信息</text>
</g>
<g class="node"><rect x="950" y="425" width="420" height="125" rx="12" fill="#e8f3ef" stroke="#24746c" stroke-width="1.5"/>
<text x="968" y="458" font-size="23" font-weight="700">worry_parking</text>
<text x="968" y="490" font-size="19" font-weight="400">睡前暂存一个担忧</text>
<text x="968" y="518" font-size="19" font-weight="400">留待合适时间处理</text>
</g>
<g class="node"><rect x="48" y="620" width="420" height="140" rx="12" fill="#fbf2df" stroke="#a37428" stroke-width="1.5"/>
<text x="66" y="653" font-size="23" font-weight="700">三段确定性短练习</text>
<text x="66" y="685" font-size="19" font-weight="400">自然呼吸 36.25秒</text>
<text x="66" y="713" font-size="19" font-weight="400">外部定向 33.7秒</text>
<text x="66" y="741" font-size="19" font-weight="400">睡前暂停 29.9秒</text>
</g>
<g class="node"><rect x="499" y="620" width="420" height="140" rx="12" fill="#edf0fa" stroke="#465aa0" stroke-width="1.5"/>
<text x="517" y="653" font-size="23" font-weight="700">现实支持连接</text>
<text x="517" y="685" font-size="19" font-weight="400">safe_support探索入口</text>
<text x="517" y="713" font-size="19" font-weight="400">safe_communication练表达</text>
<text x="517" y="741" font-size="19" font-weight="400">双方均需检查安全与意愿</text>
</g>
<g class="node"><rect x="950" y="620" width="435" height="140" rx="12" fill="#f9ebea" stroke="#a24a4b" stroke-width="1.5"/>
<text x="968" y="653" font-size="23" font-weight="700">独立风险响应</text>
<text x="968" y="685" font-size="19" font-weight="400">不作为普通策略候选</text>
<text x="968" y="713" font-size="19" font-weight="400">high接入固定支持</text>
<text x="968" y="741" font-size="19" font-weight="400">普通模型不能自行解除</text>
</g>
<text x="48" y="843" font-size="17" font-weight="400">当前 course-1.0：六张策略卡＋三段练习；每次行动一张卡，每张卡每会话最多一次。</text>
</svg>