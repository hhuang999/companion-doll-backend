name: 哭声练习与打断恢复
fixture: {exercise: breathing_60s}
auto_complete: false
steps:
  - user: 我很难过
    signals: {events: [Cry], emotion: SAD}
    expect: {offer: null, stage: comfort}
  - user: 我想做一个练习
    expect: {offer: action}
  - wait: true
  - user: 好
    expect: {offer: exercise}
  - user: 好
    expect: {mode: exercise, last_type: exercise_plan}
  - interrupt: true
    expect: {mode: normal}
  - user: 刚才有声音
    # New circumstances require reassessment before a fresh resume invitation.
    expect: {offer: null, last_purpose: waiting_card}
  - wait: true
  - user: 好
    expect: {offer: resume_exercise}
  - user: 好
    expect: {mode: exercise}
  - playback: completed
    expect: {mode: normal, stage: comfort}
