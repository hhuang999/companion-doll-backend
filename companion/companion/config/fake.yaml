replies:
  opening: 我在呢，今天想聊什么？
  explore: 听起来这件事让你很在意。后来发生了什么？
  comfort: 这样的时候觉得难受，是可以理解的。我在听。
  permission: 我们可以慢慢来。
  action: 那天具体是怎么发生的？
  closing: 今天先聊到这里，好好休息。
  quiet: 好，我在这里陪着你。
summary: '[开发夹具摘要：此会话已结束，真实内容由在线 Reasoner 提取。]'
strategy_replies:
  S16: [先只看刚才卡住的那个片段。, 哪一小部分是你能影响的？, 这一步也可以先留着，不用马上决定。]
  kind_self_talk: [一次没做好和整个人不行，是两回事。, 对朋友说的话会不会温和一些？, 先保留你觉得准确的说法就好。]
  safe_communication: [先确认你觉得对方安全，也愿意听。, 可以先草拟一句感受和希望，不急着发。, 这句话要不要用，由你决定。]
  safe_support: [担心被评价，会让开口更难。, 我们只看你自己觉得安全的一个人。, 先留一句开口的话，也可以暂时不联系。]
  values_exploration: [现在不用决定一辈子的方向。, 可以只留一个你有点好奇的问题。, 这条信息先留待和可信的人核实。]
  worry_parking: [这件担心可以先留在这里。, 今晚不用把它解决完，我们就聊到这里。]
