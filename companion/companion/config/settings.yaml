runtime: {mode: development, timezone: Asia/Shanghai}
llm:
  base_url: https://aihubmix.com/v1
  api_key_env: AIHUBMIXKEY
  talker_model: qwen-flash
  risk_model: qwen-flash
  reasoner_model: qwen-plus
  enable_thinking: false
timing:
  gate_timeout_ms: 600
  risk_total_timeout_ms: 2500
  talker_first_token_timeout_ms: 2500
  talker_total_timeout_s: 10
  reasoner_timeout_s: 20
  rest_reminder_s: 7200
  exercise_max_s: 90
  shutdown_grace_s: 25
dialogue:
  history_turns: 10
  reasoner_context_turns: 12
  reasoner_every_n_turns: 4
  max_sentences: 3
  max_action_turns: 4
  offer_valid_turns: 2
  accepted_wait_turns: 2
  accepted_wait_s: 30
pools: {risk_workers: 4, reasoner_workers: 2}
cognition:
  model_workers: 2
  max_pending: 256
  queue_timeout_s: 30
  plan_ttl_s: 120
  plan_turn_delta: 4
  context_tokens: 1200
  analysis_model: qwen-plus
  brief_model: qwen-flash
  planner_model: qwen-plus
  critic_model: qwen-flash
  delta_model: qwen-flash
  memory_model: gpt-4.1-mini
  end_model: gpt-4.1-mini
  routine: {max_calls: 4, output_tokens: 2400, total_tokens: 16000}
  deliberation: {max_calls: 8, output_tokens: 6000, total_tokens: 32000}
  memory: {max_calls: 2, output_tokens: 1800, total_tokens: 16000}
  end_consolidation: {max_calls: 2, output_tokens: 2400, total_tokens: 16000}
storage: {db_path: data/companion.db, busy_timeout_ms: 5000}
tts: {model: gpt-4o-mini-tts, voice: coral, response_format: wav}
alert_webhook: null
