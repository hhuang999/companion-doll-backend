id: values_exploration
name: 找一个暂时想了解的方向
status: enabled
requires_permission: true
targets:
  pressure_types:
  - future
  pathways: []
constraints:
  excluded_emotion_intensities:
  - high
  excluded_readiness:
  - low
reasoner:
  when_any: &id001
  - 用户愿意探索而非立刻定终身
  - 不要求升学政策或医学判断
  not_when:
  - 用户只想卸下焦虑时不做兴趣测评或规划。
  - 当前只想倾诉或明确拒绝该支持；邀请与执行许可分别判断
  success: 用户选出或暂缓一个探索问题；不推断生涯困扰改善。
  exit: 用户说停、没用、不舒服、只想说或出现安全信号时停止；不连续换方法。
talker:
  steps:
  - 从原话找一件有一点兴趣或在意的事，不编造天赋与职业适合度。
  - 共同选一个想弄清的小问题，不要求现在确定未来。
  - 用户愿意时选一个现实信息来源，如可信老师、相关从业者或官方资料；不提供未经核查的政策结论。
  examples:
  - 现在不用决定一辈子，可以先弄清你对这件事好奇什么。
  never_say:
  - 你天生适合这个专业
  - 这个选科组合一定能录取
  - 你应该选理科
limits:
  per_session: 1
emo: 🤔
source:
  document: 研究驱动课程内容 course-1.0
  verification: codex_source_checked
  evidence: companion/docs/autonomous-upgrade/research/EVIDENCE_REVIEW.md
protocol:
  version: course-1.0
  adaptation: 原创中文短步骤；仅借用研究机制，未验证本改编的效果。
  burden: 一次一小步，最多三轮；可以只听、跳过或结束。
  permission: 先明确询问是否愿意试；拒绝和撤回立即停止。
  stop: 用户说停、没用、不舒服、只想说或出现安全信号时停止；不连续换方法。
  followup: 只有用户明确提出后续事件或同意跟进才记录；下次真实唤醒尊重边界。
  feedback_limits: 只记录明确且可归因的反馈；完成、沉默和一次感觉变化不能证明策略有效或长期偏好。
  mechanism: 从用户已有兴趣或重视的事选一个可探索问题，再找可靠信息而非替用户决定。
  evidence_ids:
  - E11
  - E01
  minimum_information:
  - 用户提到的兴趣或困惑；不知道也可保留未知
  prerequisites: *id001
  excluded_contexts:
  - bedtime
  keywords:
  - 选科
  - 未来
  - 专业
  - 意义
  - 不知道喜欢
  counterexample: 用户只想卸下焦虑时不做兴趣测评或规划。
  required_contexts: []
  legacy_ids: []
