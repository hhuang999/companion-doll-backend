[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "companion-backend"
version = "0.1.0"
description = "Versioned, interruptible companion dialogue backend"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openai>=2.0,<3", "pydantic>=2.10,<3", "PyYAML>=6,<7",
  "Jinja2>=3.1,<4", "python-dotenv>=1,<2", "httpx>=0.28,<1",
  "streamlit>=1.37,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.9"]

[project.scripts]
companion = "companion.adapters.cli:main"
companion-dashboard = "companion.dashboard.launch:main"
companion-probe = "companion.tools.probe:main"
companion-bench = "companion.tools.bench:main"
companion-purge = "companion.tools.purge:main"

[tool.setuptools.packages.find]
include = ["companion*"]

[tool.setuptools.package-data]
companion = ["config/*.yaml", "config/cards/*.yaml", "config/exercises/*.yaml", "config/prompts/*.j2", "store/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not online and not hardware'"
markers = ["online: calls paid external model APIs", "hardware: requires a connected device"]

[tool.ruff]
target-version = "py310"
line-length = 100
