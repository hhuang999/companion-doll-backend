<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
<title id="title">11  语音流水：当前句发送时准备下一句</title><desc id="desc">当前实现仍需等待完整WAV；有界下一句预取主要减少后续句间等待。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#718087"/></marker></defs>
<style>text{font-family:"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#243538} .edge{fill:none;stroke:#718087;stroke-width:2;marker-end:url(#arrow)}</style>
<rect width="1440" height="820" fill="#fbfaf6"/>
<text x="48" y="52" font-size="30" font-weight="700">11  语音流水：当前句发送时准备下一句</text>
<text x="48" y="88" font-size="19" font-weight="400">当前实现仍需等待完整WAV；有界下一句预取主要减少后续句间等待。</text>
<text x="48" y="145" font-size="22" font-weight="700">当前句</text>
<g class="node"><rect x="48" y="175" width="305" height="105" rx="12" fill="#e8f3ef" stroke="#24746c" stroke-width="1.5"/>
<text x="66" y="208" font-size="23" font-weight="700">Talker分句</text>
<text x="66" y="240" font-size="19" font-weight="400">得到可发声文本</text>
</g>
<polyline class="edge" points="353,228 395,228"/>
<g class="node"><rect x="395" y="175" width="305" height="105" rx="12" fill="#e8f3ef" stroke="#24746c" stroke-width="1.5"/>
<text x="413" y="208" font-size="23" font-weight="700">动态TTS</text>
<text x="413" y="240" font-size="19" font-weight="400">完整WAV返回</text>
</g>
<polyline class="edge" points="700,228 742,228"/>
<g class="node"><rect x="742" y="175" width="305" height="105" rx="12" fill="#e8f3ef" stroke="#24746c" stroke-width="1.5"/>
<text x="760" y="208" font-size="23" font-weight="700">Opus编码</text>
<text x="760" y="240" font-size="19" font-weight="400">首包ready</text>
</g>
<polyline class="edge" points="1047,228 1089,228"/>
<g class="node"><rect x="1089" y="175" width="305" height="105" rx="12" fill="#e8f3ef" stroke="#24746c" stroke-width="1.5"/>
<text x="1107" y="208" font-size="23" font-weight="700">代次检查＋发送</text>
<text x="1107" y="240" font-size="19" font-weight="400">首包sent／client收到</text>
</g>
<text x="48" y="345" font-size="22" font-weight="700">下一句</text>
<g class="node"><rect x="395" y="375" width="652" height="120" rx="12" fill="#edf0fa" stroke="#465aa0" stroke-width="1.5"/>
<text x="413" y="408" font-size="23" font-weight="700">最多预取下一句：准备与当前句发送重叠</text>
<text x="413" y="440" font-size="19" font-weight="400">2个语音槽；按句序消费；generation变化即取消</text>
<text x="413" y="468" font-size="19" font-weight="400">已开始的外部调用可能仍占槽，完成后结果也不得发送</text>
</g>
<polyline class="edge" points="1100,280 1100,335 720,335 720,375" stroke-dasharray="7 5"/>
<g class="node"><rect x="48" y="580" width="420" height="125" rx="12" fill="#f9ebea" stroke="#a24a4b" stroke-width="1.5"/>
<text x="66" y="613" font-size="23" font-weight="700">固定音频接管</text>
<text x="66" y="645" font-size="19" font-weight="400">缓存危机／练习片段</text>
<text x="66" y="673" font-size="19" font-weight="400">绕过动态TTS，不绕过取消</text>
</g>
<g class="node"><rect x="535" y="580" width="400" height="125" rx="12" fill="#fbf2df" stroke="#a37428" stroke-width="1.5"/>
<text x="553" y="613" font-size="23" font-weight="700">输出事件</text>
<text x="553" y="645" font-size="19" font-weight="400">started／completed／cancelled</text>
<text x="553" y="673" font-size="19" font-weight="400">与支持ID、版本和步骤关联</text>
</g>
<g class="node"><rect x="1000" y="580" width="395" height="125" rx="12" fill="#f2ecf6" stroke="#805b96" stroke-width="1.5"/>
<text x="1018" y="613" font-size="23" font-weight="700">用户后续表达</text>
<text x="1018" y="645" font-size="19" font-weight="400">明确反馈 → 支持经历候选</text>
<text x="1018" y="673" font-size="19" font-weight="400">没有反馈 → 不推断有效</text>
</g>
<polyline class="edge" points="468,640 535,640"/>
<polyline class="edge" points="935,640 1000,640"/>
<polyline class="edge" points="1240,280 1410,280 1410,535 735,535 735,580"/>
<text x="48" y="793" font-size="17" font-weight="400">测量分别记录首token、首句、TTS、编码、发送及客户端接收；服务端completed不是设备播放ACK。</text>
</svg>